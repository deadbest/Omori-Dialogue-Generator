<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Omori Dialogue Generator</title>
  <link rel="stylesheet" href="css/style.css" type="text/css">
  <link rel="icon" href="imgs/favicon.ico">
  <script type="text/javascript" src="js/script.js"></script>
  <script type="text/javascript" src="js/canvas.js"></script>
</head>

<body>
  <h1 id="title">Omori Dialogue Generator</h1>
  <hr id="info-seperator">

  <form id="frame_0" class="speech-frame">
    <div class="settings">
      <table>
        <tr>
          <td>
            <input id="toggle_bg_0" class="toggle-bg" type="checkbox" name="enable-bg" checked onclick="toggleElement('toggle_bg_0', 'bg_img_0')">
            Enable Background?
          </td>
          <td>
            <input type="button" name="clear-bg" value="Clear Background" onclick="clearElement('bg_img_0')">
          </td>
        </tr>
        <tr>
          <td>
            <input id="toggle_portrait_0" class="toggle-portrait" type="checkbox" name="enable-portrait" checked onclick="toggleElement('toggle_portrait_0', 'char_img_0')">
            Enable Portrait?
          </td>
          <td>
            <input type="button" name="clear-portrait" value="Clear Portrait" onclick="clearElement('char_img_0')">
          </td>
        </tr>
        <tr>
          <td>
            <input id="toggle_disturbed_0" type="checkbox" name="enable-disturbed" value="Enable Disturbed?" onclick="toggleText('toggle_disturbed_0', 'dialogue_0')">
            Enable Disturbed Text?
          </td>
          <td>
            <input type="button" name="clear-all-frame" value="Clear All in Frame" onclick="clearFrame('frame_0')">
          </td>
        </tr>
      </table>
    </div>

    <div class="screen-background">
      <div class="wrap-black">
        <img id="bg_img_0" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="wrap-white bg-pic box">
        <input type="file" name="select-bg" class="bg-pic-button" onchange="displayPortrait(event, 'bg_img_0')" accept="image/*">
      </div>
    </div>

    <div class="top-half">
      <div class="char-name-wrapper">
        <div class="wrap-black">
          <input id="char_name_0" onkeydown="return event.key != 'Enter';" onchange="this.style.width = 0; this.style.width = this.scrollWidth - 11 + 'px';" type="text" name="Character Name" value="Edit me (character name)"
            class="wrap-white char-name box">
          <!-- Okay, I got lazy here with the inline JS -->
        </div>
      </div>
      <div class="char-pic-wrapper">
        <div class="wrap-black">
          <img id="char_img_0" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="wrap-white char-pic box">
          <input type="file" name="select-character" class="char-pic-button" onchange="displayPortrait(event, 'char_img_0')" accept="image/*">
        </div>
      </div>
    </div>
    <div class="bottom-half">
      <div class="wrap-black">
        <textarea id='dialogue_0' class="dialogue-box wrap-white box">Edit me (dialogue)</textarea>
      </div>
    </div>
    <br>
  </form>
  <div>
      <input type="button" name="render" value="Render! (output will appear below)" onclick="renderCanvas('frame_0', 'download_0'); displayDownload('download_0')">
      <canvas id="output_0" width="640" height="480"></canvas>
      <a href="#" class="download" id="download_0" download="output.png">Download Image</a>
  </div>
</body>

</html>
